name: central_african_republic_plate
description: "Central African Republic's licence plates for the plate_core library: the black-on-white CEMAC plate, a theme, alphabets and an advisory validator."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.12.0
  plate_alphabet: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
